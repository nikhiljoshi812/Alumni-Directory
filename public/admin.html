<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Alumni Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">

    <header class="bg-white shadow-md w-full sticky top-0 z-10">
        <nav class="container mx-auto px-6 py-3 flex justify-between items-center">
            <a href="https://www.uudoon.in/" class="flex items-center space-x-3">
                <img src="/image/logo.jpeg" alt="University Logo" class="h-10 w-10">
                <span class="text-xl font-bold text-gray-800">Admin Panel</span>
            </a>
            <button id="logoutBtn"
                class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                Logout
            </button>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-8">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-lg">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-4">Pending Approval Requests</h2>

            <div id="pendingList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>

</html>
