<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Simple scrollbar for the chat box */
        #messages {
            max-height: 400px;
        }
    </style>
</head>

<body class="bg-gray-100">
    <header class="bg-white shadow-md w-full sticky top-0 z-10">
        <nav class="container mx-auto px-6 py-3 flex justify-between items-center">
            <a href="https://www.uudoon.in/" target="_blank" rel="noopener noreferrer"
                class="flex items-center space-x-3">
                <img src="/image/logo.jpeg" alt="University Logo" class="h-10 w-10">
                <span class="text-xl font-bold text-gray-800">Alumni Network</span>
            </a>
        <div class="hidden md:flex items-center space-x-6">
            <a href="/dashboard.html" class="text-gray-600 hover:text-blue-600 font-semibold">Directory</a>
            <span id="userNameDisplay" class="font-semibold text-blue-600"></span>
            <button id="logoutBtn"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                Logout
            </button>
        </div>
            <button id="sidebarToggle" class="text-gray-800 focus:outline-none" aria-label="Open menu">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>
        </nav>
    </header>


    <div class="flex" style="height: calc(100vh - 68px);">

        <aside id="sidebar" class="w-64 bg-white shadow-md flex-shrink-0 transition-transform duration-300 ease-in-out">
            <div class="p-6">
                <h2 class="text-lg font-semibold text-gray-700 border-b pb-3">Contacts</h2>
            </div>
            <nav id="online-users-list" class="mt-2">
                <a href="#" class="flex items-center p-4 text-gray-600 hover:bg-gray-100">
                    <span class="h-3 w-3 rounded-full bg-green-500 mr-3"></span>
                    Nikhil Joshi (Example)
                </a>
                <a href="#" class="flex items-center p-4 text-gray-600 hover:bg-gray-100">
                    <span class="h-3 w-3 rounded-full bg-gray-400 mr-3"></span>
                    Test User (Example)
                </a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">

            <div class="bg-white p-6 rounded-2xl shadow-lg mb-8">
                <h2 class="text-3xl font-bold text-gray-800 mb-4">Alumni Directory</h2>
                <input type="text" id="searchInput" placeholder="Search alumni..."
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div class="grid lg:grid-cols-3 gap-8">
                <div id="alumniDirectory" class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-8 self-start">
                </div>


            </div>
        </main>
    </div>
    <div id="chat-widget-container" class="fixed bottom-4 right-4 z-20">
        <div class="w-80 bg-white rounded-xl shadow-2xl">
            <div id="chat-header"
                class="bg-blue-600 text-white p-3 rounded-t-xl flex justify-between items-center cursor-pointer">
                <h3 class="font-bold">Global Chat 💬</h3>
                <span id="chat-toggle-icon">▼</span>
            </div>
            <div id="chat-body" class="p-4 hidden">
                <ul id="messages" class="overflow-y-auto space-y-2 mb-3 h-64">
                </ul>
                <form id="chatForm" class="flex">
                    <input id="chatInput" autocomplete="off"
                        class="flex-grow px-3 py-2 border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-sm"
                        placeholder="Type a message..." />
                    <button
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-r-md transition duration-300 text-sm">Send</button>
                </form>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
