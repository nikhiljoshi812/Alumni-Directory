<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alumni Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-lg w-full max-w-md">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600">Welcome Back!</h1>
            <p class="text-gray-500 mt-2">Log in to connect with the network.</p>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                    required>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" placeholder="••••••••"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                Login
            </button>
        </form>

        <p id="message" class="text-center font-semibold mt-4"></p>

        <div class="text-center mt-6">
            <p class="text-gray-600">Don't have an account?
                <a href="/register.html" class="font-semibold text-blue-600 hover:underline">Register here</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
