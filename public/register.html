
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Alumni Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen py-12">

    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-lg w-full max-w-lg">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600">Join the Network</h1>
            <p class="text-gray-500 mt-2">Create your account to get started.</p>
        </div>

        <form id="registerForm">
            <div class="grid md:grid-cols-2 md:gap-6">
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 font-semibold mb-2">Full Name</label>
                    <input type="text" id="name" placeholder="Nikhil Joshi"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        required>
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-semibold mb-2">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" placeholder="••••••••"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                    required>
            </div>

            <div class="grid md:grid-cols-2 md:gap-6">
                <div class="mb-4">
                    <label for="graduationYear" class="block text-gray-700 font-semibold mb-2">Graduation Year</label>
                    <input type="number" id="graduationYear" placeholder="2025"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        required>
                </div>
                <div class="mb-4">
                    <label for="branch" class="block text-gray-700 font-semibold mb-2">Branch</label>
                    <input type="text" id="branch" placeholder="MCA"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        required>
                </div>
            </div>

            <div class="mb-6">
                <label for="currentCompany" class="block text-gray-700 font-semibold mb-2">Current Company
                    (Optional)</label>
                <input type="text" id="currentCompany" placeholder="Google"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                Create Account
            </button>
        </form>

        <p id="message" class="text-center font-semibold mt-4"></p>

        <div class="text-center mt-6">
            <p class="text-gray-600">Already have an account?
                <a href="/login.html" class="font-semibold text-blue-600 hover:underline">Login here</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
